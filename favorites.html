<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites | Paperwing</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body class="bg-stone-50 text-stone-900">

    <header class="border-b border-stone-200 bg-white">
        <!-- Navigation  -->
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
            <a href="/" class="text-xl font-bold tracking-tight">
                paper<span class="text-emerald-700">wing.</span>
            </a>

            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="text-stone-600 hover:text-emerald-700">Home</a>
                <a href="/favorites.html" class="text-emerald-700">Favorites</a>
                <a href="/about.html" class="text-stone-600 hover:text-emerald-700">About</a>
            </div>
        </nav>
    </header>

    <main class="px-6 py-14 sm:py-16">
        <div class="mx-auto max-w-7xl">

            <!-- Page title -->
            <div class="mb-10">
                <p class="text-sm font-semibold uppercase tracking-[0.18em] text-emerald-900">
                    Your shelf
                </p>
                <h1 class="mt-2 font-serif text-3xl font-bold tracking-tight sm:text-4xl">
                    Favorites
                </h1>
                <p class="mt-2 text-base text-stone-500 sm:text-lg">
                    Books you've saved. They stay here even after you refresh the page.
                </p>
            </div>

            <!-- Saved books -->
            <section class="mb-14">
                <h2 class="mb-6 font-serif text-2xl font-bold">Saved books</h2>

                <p id="favorites-empty"
                    class="hidden rounded-xl border border-dashed border-stone-300 px-6 py-12 text-center text-stone-500">
                    No favorites yet. Add a book below or from the homepage.
                </p>

                <div id="favorites-list"
                    class="grid grid-cols-1 min-[340px]:grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
                    <!-- Favorite books will be rendered here -->
                </div>
            </section>

            <!-- Suggested books -->
            <section>
                <h2 class="mb-6 font-serif text-2xl font-bold">Suggested books</h2>

                <div id="suggested-list"
                    class="grid grid-cols-1 min-[340px]:grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
                    <!-- Suggested books will be rendered here -->
                </div>
            </section>

        </div>
    </main>
    <footer class="border-t border-stone-200 bg-white">
        <div
            class="mx-auto flex max-w-7xl flex-col gap-2 px-6 py-8 text-sm text-stone-500 sm:flex-row sm:items-center sm:justify-between">
            <p class="font-semibold text-stone-800">paperwing.</p>
            <p>Discover your next favorite book.</p>
            <p>&copy; 2026 PaperWing</p>
        </div>
    </footer>

    <script type="module" src="/src/js/favoritesPage.js"></script>
    <script type="module" src="/src/js/nav.js"></script>
</body>

</html>
