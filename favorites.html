<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites | Paperwing</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body class="bg-beige text-stone-900">

        <header class="border-b border-stone-200 bg-cream">
        <!-- Navigation  -->
        <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-6 py-5">
            <a href="/" class="text-xl font-bold tracking-tight">
                paper<span class="text-emerald-700">wing.</span>
            </a>

            <!-- Hamburger button (phones only) -->
            <button id="menu-button" type="button" aria-label="Open menu" aria-expanded="false"
                class="rounded-lg p-2 text-stone-700 hover:bg-stone-100 md:hidden">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!-- Links: dropdown on phones, a row on bigger screens -->
            <div id="nav-links"
                class="hidden w-full flex-col gap-1 pt-4 text-sm font-medium md:flex md:w-auto md:flex-row md:items-center md:gap-6 md:pt-0">
                <a href="/" class="py-2 text-stone-600 hover:text-emerald-700 md:py-0">Home</a>
                <a href="/favorites.html" class="py-2 text-emerald-700 md:py-0">Favorites</a>
                <a href="/about.html" class="py-2 text-stone-600 hover:text-emerald-700 md:py-0">About</a>
            </div>
        </nav>
    </header>

    <main class="px-6 py-14 sm:py-16">
        <div class="mx-auto max-w-7xl">

            <!-- Page title -->
            <div class="mb-10">
                <p class="text-sm font-semibold uppercase tracking-[0.18em] text-emerald-900">
                    Your shelf
                </p>
                <h1 class="mt-2 font-serif text-3xl font-bold tracking-tight sm:text-4xl">
                    Favorites
                </h1>
                <p class="mt-2 text-base text-stone-500 sm:text-lg">
                    Books you've saved. Your shelf is ready when you are.
                </p>
            </div>
            <!-- Explore button -->
            <a href="/#explore"
                class="mb-10 inline-flex items-center gap-2 rounded-full bg-emerald-900 px-6 py-3 font-semibold text-white transition hover:bg-emerald-950">
                Explore books →
            </a>
            <!-- Saved books -->
            <section class="mb-14">
                <h2 class="mb-6 font-serif text-2xl font-bold">Saved books</h2>

                <p id="favorites-empty"
                    class="hidden rounded-xl border border-dashed border-stone-300 px-6 py-12 text-center text-stone-500">
                    No favorites yet. Add a book below or from the homepage.
                </p>

                <div id="favorites-list"
                    class="grid grid-cols-1 min-[340px]:grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
                    <!-- Favorite books will be rendered here -->
                </div>
            </section>

            <!-- Suggested books -->
            <section>
                <h2 class="mb-6 font-serif text-2xl font-bold">Suggested books</h2>

                <div id="suggested-list"
                    class="grid grid-cols-1 min-[340px]:grid-cols-2 gap-5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
                    <!-- Suggested books will be rendered here -->
                </div>
            </section>

        </div>
    </main>
    <footer class="border-t border-stone-200 bg-cream">
        <div
            class="mx-auto flex max-w-7xl flex-col gap-2 px-6 py-8 text-sm text-stone-500 sm:flex-row sm:items-center sm:justify-between">
            <p class="font-semibold text-stone-800">paperwing.</p>
            <p>Discover your next favorite book.</p>
            <p>&copy; 2026 PaperWing</p>
        </div>
    </footer>

    <script type="module" src="/src/js/favoritesPage.js"></script>
    <script type="module" src="/src/js/nav.js"></script>
</body>

</html>
