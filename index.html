
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header>
    <!-- Navigation  -->
  </header>

  <main>
    <!-- Hero section -->
    <section>
      <h1>Find your next great read.</h1>
      <p>Explore stories, discover new ideas, and find books worth reading.</p>
    </section>

    <!-- Search section -->
    <section>
      <form id="search-form">
        <input
          type="search"
          id="search-input"
          placeholder="Search books by title..."
        >
        <button type="submit">Search</button>
      </form>
    </section>

    <!-- Book collection -->
    <section>
      <h2>Explore books</h2>
      <div id="book-list">
        <!-- Book cards -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Book Explorer</p>
  </footer>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
